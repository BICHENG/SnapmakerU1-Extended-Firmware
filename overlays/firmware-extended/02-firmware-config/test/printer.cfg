# The six heater_fan sections of the factory printer.cfg of the Snapmaker U1
# (power_fan and the four nozzle fans), copied verbatim. Only these are
# needed here: they hold the heater lists, the fan tables and the cavity
# guard the heater_fan driver reads. The rest of the factory configuration
# belongs to the printer, not to the fan driver.
#
# Source: the stock printer.cfg of the Klipper release the firmware ships
# with. The heater_fan driver of that same release is the stock_heater_fan.py
# fixture next to this file.

[heater_fan power_fan]
pin: !PC9
heater: extruder, extruder1, extruder2, extruder3
shutdown_speed: 0
temp_speed_table:
  9999, 260, 1, 3, 1
  9999, 45, 1, 1, 0.6

[heater_fan e0_nozzle_fan]
pin: !e0:PB0
tachometer_pin: e0:PA10
heater: extruder
heater_temp: 45
fan_speed: 1
probe_speed: 0.5
stepped_temp_table:
  45, 0.3
  60, 0.35
  70, 0.4
  100, 0.45
  140, 0.5
  160, 0.6
  180, 0.65
  200, 0.7
  220, 0.75
  230, 0.8
  240, 0.85
  260, 0.9
external_temp_sensor: cavity            # [temperature_sensor cavity]
external_temp_guard_range: -15.0, 45.0  # Guard temperature range [min, max]
external_temp_guard_fan_speed: 1.0      # Fan speed when temperature outside guard range
# tachometer_ppr:1
tachometer_poll_interval: 0.0005
max_power: 1
shutdown_speed: 0

