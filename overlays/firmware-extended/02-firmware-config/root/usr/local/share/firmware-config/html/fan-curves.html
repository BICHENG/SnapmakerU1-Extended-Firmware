<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fan curve editor</title>
<style>
    :root {
        --bg: #1a1a1a; --card: #2d2d2d; --item: #3d3d3d; --hover: #4d4d4d;
        --accent: #4fc3f7; --text: #e0e0e0; --muted: #888;
        --success: #81c784; --error: #e57373; --warning: #ff9800;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        background: var(--card);
        color: var(--text);
        display: flex;
        flex-direction: column;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 14px;
        gap: 10px;
        margin: 0;
        overflow: auto;
        padding: 12px 14px;
    }
    button { font-family: inherit; }
    .btn {
        background: var(--item); border: 1px solid #555; border-radius: 6px;
        color: var(--text); cursor: pointer; font-size: 13px; padding: 8px 14px;
    }
    .btn:hover:not(:disabled) { background: var(--hover); }
    .btn:disabled { cursor: not-allowed; opacity: 0.45; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
    .btn-primary:hover:not(:disabled) { background: #6fd0f8; }
    .btn-secondary { background: var(--item); }
    .btn-danger { background: transparent; border-color: var(--error); color: var(--error); }
    .btn-danger:hover:not(:disabled) { background: rgba(229, 115, 115, 0.15); }
    select, input[type="number"] {
        background: var(--item); border: 1px solid #555; border-radius: 6px;
        color: var(--text); font-family: inherit; font-size: 13px; padding: 8px 10px;
    }
    select:focus, input[type="number"]:focus { outline: none; border-color: var(--accent); }

    .editor-head { align-items: center; display: flex; flex-wrap: wrap; gap: 12px; }
    .editor-head-left { align-items: center; display: flex; gap: 10px; }
    .editor-head label { color: var(--muted); font-size: 12px; }
    .editor-head select { min-width: 180px; }
    .editor-active { color: var(--muted); font-size: 12px; }
    .editor-tabs { display: flex; gap: 8px; margin-left: auto; }

    .editor-main { display: flex; flex: 1 1 auto; min-height: 240px; }
    .panel { background: var(--bg); border: 1px solid #3a3a3a; border-radius: 8px; padding: 12px; }
    .panel-chart { display: flex; flex: 1; flex-direction: column; min-height: 0; padding: 8px; }
    .editor-extra { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    details.panel { padding: 0; }
    details.panel > summary {
        color: var(--muted); cursor: pointer; font-size: 11px; letter-spacing: 0.5px;
        list-style: none; padding: 11px 12px; text-transform: uppercase;
    }
    details.panel > summary::-webkit-details-marker { display: none; }
    details.panel > summary::before { content: "▸ "; }
    details.panel[open] > summary::before { content: "▾ "; }
    details.panel > summary:hover { color: var(--text); }
    details.panel > .detail-body { padding: 0 12px 12px; }
    @media (max-width: 860px) {
        .editor-extra { grid-template-columns: 1fr; }
    }

    .chart-wrap { background: #202020; border-radius: 6px; flex: 1 1 auto; min-height: 0; position: relative; }
    .chart { display: block; height: 100%; left: 0; position: absolute; top: 0; touch-action: none; width: 100%; }
    .chart:focus { outline: none; }
    .chart text { fill: var(--muted); font-size: 11px; }
    .chart-grid { stroke: #3d3d3d; stroke-width: 1; }
    .chart-axis { stroke: #6a6a6a; stroke-width: 1; }
    .chart-line { fill: none; stroke: var(--accent); stroke-width: 2.5; }
    .chart-reference { fill: none; stroke: #6a6a6a; stroke-dasharray: 5 4; stroke-width: 1.5; }
    .chart-floor-line { stroke: var(--warning); stroke-dasharray: 4 4; stroke-width: 1.5; }
    .chart-floor-label { fill: var(--warning); font-size: 10px; }
    .chart-floor-label-bg { fill: #202020; }
    .chart-dot { fill: #7a7a7a; }
    .chart-point { cursor: grab; fill: var(--accent); stroke: #111; stroke-width: 2; }
    .chart-point:active { cursor: grabbing; }
    .chart-point.selected { stroke: #fff; stroke-width: 3; }
    .chart-point:focus { outline: none; }

    .legend { align-items: center; color: var(--muted); display: flex; flex-wrap: wrap; font-size: 11px; gap: 16px; padding: 8px 4px 0; }
    .legend-item { align-items: center; display: flex; gap: 7px; }
    .legend-item[hidden] { display: none; }
    .swatch { border-top: 2px solid var(--accent); display: inline-block; height: 0; width: 24px; }
    .swatch.floor { border-top: 2px dashed var(--warning); }
    .swatch.stock { border-top: 1.5px dashed #6a6a6a; }

    .editor-strip { align-items: center; display: flex; flex-wrap: wrap; gap: 8px 16px; }
    .strip-title { color: var(--muted); font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; }
    .strip-fields { align-items: center; display: flex; flex-wrap: wrap; gap: 8px 16px; }
    .strip-fields[hidden] { display: none; }
    .strip-field { align-items: center; color: var(--muted); display: flex; font-size: 12px; gap: 6px; }
    .strip-field input { width: 84px; }
    .unit { color: var(--muted); font-size: 12px; }
    .strip-hint { color: var(--muted); font-size: 12px; }
    .strip-hint[hidden] { display: none; }
    #hint { margin-left: auto; text-align: right; }

    .compare { border-collapse: collapse; font-size: 12px; width: 100%; }
    .compare th { color: var(--muted); font-weight: 500; padding: 4px 8px; text-align: right; }
    .compare th:first-child, .compare td:first-child { text-align: left; }
    .compare td { border-top: 1px solid #333; padding: 4px 8px; text-align: right; }
    .compare tr.floored td:last-child { color: var(--warning); }
    .compare-note { color: var(--muted); font-size: 11px; line-height: 1.6; margin: 10px 0 0; }

    .rules { color: var(--muted); font-size: 12px; line-height: 1.7; margin: 0; }

    .editor-foot { align-items: center; display: flex; flex-wrap: wrap; gap: 12px; }
    .status { color: var(--muted); flex: 1 1 200px; font-size: 12px; min-height: 18px; }
    .status.error { color: var(--error); }
    .status.warning { color: var(--warning); }
    .status.success { color: var(--success); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .backdrop {
        align-items: center; background: rgba(0, 0, 0, 0.6); display: flex;
        inset: 0; justify-content: center; padding: 24px; position: fixed; z-index: 50;
    }
    .backdrop[hidden] { display: none; }
    .dialog { background: var(--card); border: 1px solid #444; border-radius: 10px; max-width: 460px; padding: 18px; width: 100%; }
    .dialog-title { font-size: 15px; margin-bottom: 10px; }
    .dialog-body { color: var(--muted); font-size: 13px; line-height: 1.7; white-space: pre-wrap; }
    .dialog-log { color: var(--muted); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.6; margin: 0; max-height: 220px; overflow: auto; white-space: pre-wrap; }
    .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

    @media (max-width: 860px) {
        #hint { margin-left: 0; text-align: left; }
    }
</style>
</head>
<body>

<div class="editor-head">
    <div class="editor-head-left">
        <label for="profile">Profile</label>
        <select id="profile" aria-label="Fan curve profile"></select>
        <span class="editor-active" id="active"></span>
    </div>
    <div class="editor-tabs">
        <button class="btn btn-secondary" id="power-tab" type="button">Power fan</button>
        <button class="btn btn-secondary" id="nozzle-tab" type="button">Nozzle fans (×4)</button>
    </div>
</div>

<main class="editor-main">
    <section class="panel panel-chart">
        <div class="chart-wrap" id="chart-wrap">
            <svg class="chart" id="chart" tabindex="0" role="application" aria-label="Fan curve chart"></svg>
        </div>
        <div class="legend">
            <span class="legend-item"><span class="swatch"></span><span id="legend-selected">Curve</span></span>
            <span class="legend-item" id="legend-floor" hidden><span class="swatch floor"></span>Driver floor</span>
            <span class="legend-item" id="legend-stock" hidden><span class="swatch stock"></span>Stock</span>
        </div>
    </section>
</main>

<div class="editor-strip">
    <span class="strip-title" id="point-title">Selected point</span>
    <div class="strip-fields" id="point-editor" hidden>
        <label class="strip-field">
            <span>Temperature</span>
            <input id="point-temperature" type="number" step="1" min="0" max="300"><span class="unit">°C</span>
        </label>
        <label class="strip-field">
            <span>Duty</span>
            <input id="point-duty" type="number" step="0.1" min="0"><span class="unit">%</span>
        </label>
        <button class="btn btn-danger" id="point-delete" type="button">Delete point</button>
    </div>
    <span class="strip-hint" id="point-empty"></span>
    <span class="strip-hint" id="hint"></span>
</div>

<div class="editor-extra">
    <details class="panel">
        <summary>Stock against the selected curve</summary>
        <div class="detail-body">
            <table class="compare">
                <thead><tr><th>°C</th><th>Stock</th><th id="compare-selected">Selected</th></tr></thead>
                <tbody id="compare-body"></tbody>
            </table>
            <p class="compare-note" id="compare-note"></p>
        </div>
    </details>
    <details class="panel">
        <summary>How this profile behaves</summary>
        <div class="detail-body">
            <p class="rules" id="rules"></p>
        </div>
    </details>
</div>

<div class="editor-foot">
    <div class="status" id="status" aria-live="polite"></div>
    <div class="actions">
        <button class="btn btn-secondary" id="copy" type="button">Copy preset to Custom</button>
        <button class="btn btn-secondary" id="add-point" type="button">Add point</button>
        <button class="btn btn-secondary" id="discard" type="button">Discard changes</button>
        <button class="btn btn-secondary" id="save" type="button">Save Custom</button>
        <button class="btn btn-primary" id="apply" type="button">Apply</button>
    </div>
</div>

<div class="backdrop" id="confirm-backdrop" hidden>
    <div class="dialog">
        <div class="dialog-title" id="confirm-title"></div>
        <div class="dialog-body" id="confirm-body"></div>
        <div class="dialog-actions">
            <button class="btn btn-secondary" id="confirm-cancel" type="button">Cancel</button>
            <button class="btn btn-primary" id="confirm-ok" type="button">Confirm</button>
        </div>
    </div>
</div>

<div class="backdrop" id="action-backdrop" hidden>
    <div class="dialog">
        <div class="dialog-title" id="action-title"></div>
        <pre class="dialog-log" id="action-log"></pre>
        <div class="dialog-actions">
            <button class="btn btn-primary" id="action-close" type="button">Close</button>
        </div>
    </div>
</div>

<script>
const $ = id => document.getElementById(id);

const CHART_MARGIN = { left: 52, right: 18, top: 18, bottom: 34 };
const CHART_MIN = { width: 320, height: 200 };
const MAX_TEMPERATURE = 300;

let state = null;
let selectedProfile = 'stock';
let activeCurve = 'power';
let selectedNode = -1;
let draft = { power: [], nozzle: [] };
let savedDraft = { power: [], nozzle: [] };
let dirty = false;
let drag = null;
let pendingClick = null;
let chartSize = { width: 760, height: 400 };

// ---------------------------------------------------------------- helpers

function escapeHtml(value) {
    const entities = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    return String(value ?? '').replace(/[&<>"']/g, character => entities[character]);
}

function profileKey(key) {
    return String(key || '').toLowerCase().replace(/[- ]/g, '_');
}

const PROFILE_LABELS = { stock: 'Stock', optimal: 'Optimal', custom: 'Custom' };

// A preset that is not shipped with the firmware keeps its own name.
function profileLabel(key) {
    const known = PROFILE_LABELS[key];
    if (known) return known;
    return String(key || '').split('_').filter(Boolean)
        .map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
}

function pointsOf(value) {
    const list = Array.isArray(value) ? value : [];
    return list.map(point => {
        if (Array.isArray(point)) return [Number(point[0]), Number(point[1])];
        return [Number(point.temperature ?? point.temp), Number(point.duty ?? point.speed ?? point.value)];
    }).filter(point => point.every(Number.isFinite));
}

function profile(value) {
    const source = value && typeof value === 'object' ? value : {};
    const curves = source.curves && typeof source.curves === 'object' ? source.curves : source;
    return {
        power: pointsOf(curves.power || curves.power_fan),
        nozzle: pointsOf(curves.nozzle || curves.nozzle_fans)
    };
}

// The stock table is a step table: the duty of the last row at or below
// the temperature.
function step(points, temperature) {
    let duty = 0;
    for (const [threshold, value] of points) {
        if (temperature >= threshold) duty = value;
        else break;
    }
    return duty;
}

// A curve is a line between its points, the same way the driver reads it.
function curveDuty(points, temperature) {
    if (!points.length) return 0;
    if (temperature < points[0][0]) return 0;
    const last = points[points.length - 1];
    if (temperature >= last[0]) return last[1];
    for (let index = 1; index < points.length; index++) {
        const [lowTemperature, lowDuty] = points[index - 1];
        const [highTemperature, highDuty] = points[index];
        if (temperature < highTemperature) {
            const span = highTemperature - lowTemperature;
            if (span <= 0) return highDuty;
            return lowDuty + (highDuty - lowDuty) * (temperature - lowTemperature) / span;
        }
    }
    return last[1];
}

function maxPoints() {
    return Number(state?.limits?.max_points) || 16;
}

function maxDuty() {
    const value = Number(state?.limits?.duty?.[1]);
    return Number.isFinite(value) ? Math.min(value, 1) : 1;
}

// The rule the driver holds a nozzle fan at. It comes with the state, so
// changing it in the firmware-config module changes it here as well.
function floorLimit() {
    const temperature = Number(state?.limits?.min_cool_temperature);
    const duty = Number(state?.limits?.min_nozzle_duty);
    if (!Number.isFinite(temperature) || !Number.isFinite(duty)) return null;
    return { temperature, duty };
}

// The duty the driver really runs at a temperature.
function effectiveDuty(points, temperature) {
    const duty = curveDuty(points, temperature);
    const limit = floorLimit();
    if (!limit || activeCurve !== 'nozzle' || temperature < limit.temperature) return duty;
    return Math.max(duty, limit.duty);
}

// ---------------------------------------------------------------- state

function normalize(payload) {
    const presets = {};
    Object.entries(payload.presets || {}).forEach(([key, value]) => {
        presets[profileKey(key)] = profile(value);
    });
    const saved = profile(payload.custom);
    draft = { power: saved.power.slice(), nozzle: saved.nozzle.slice() };
    savedDraft = { power: saved.power.slice(), nozzle: saved.nozzle.slice() };
    dirty = false;
    selectedNode = -1;
    return {
        current: profileKey(payload.current || 'stock'),
        profiles: Array.isArray(payload.profiles) && payload.profiles.length
            ? payload.profiles.map(profileKey)
            : ['stock', ...Object.keys(presets).sort(), 'custom'],
        presets,
        stock: profile(payload.stock),
        limits: payload.limits || {},
        hysteresis: Number.isFinite(Number(payload.hysteresis)) ? Number(payload.hysteresis) : 5,
        heavyLoad: payload.heavy_load || { temperature: 260, heater_count: 3, hot_count: 1, duty: 1 }
    };
}

function isEditable() {
    return selectedProfile === 'custom';
}

// The points the chart shows for the selected profile and curve.
function shownPoints() {
    if (selectedProfile === 'custom') return draft[activeCurve] || [];
    if (selectedProfile === 'stock') return (state.stock || {})[activeCurve] || [];
    return (state.presets[selectedProfile] || {})[activeCurve] || [];
}

function setStatus(message, kind = '') {
    const status = $('status');
    status.textContent = message || '';
    status.className = `status${kind ? ` ${kind}` : ''}`;
}

// ---------------------------------------------------------------- chart

// The chart fills its panel, so its size comes from the panel.
function measureChart() {
    const wrap = $('chart-wrap');
    const rect = wrap.getBoundingClientRect();
    return {
        width: Math.max(CHART_MIN.width, Math.round(rect.width)),
        height: Math.max(CHART_MIN.height, Math.round(rect.height))
    };
}

function chartGeometry() {
    const { width, height } = chartSize;
    const margin = CHART_MARGIN;
    const plotWidth = width - margin.left - margin.right;
    const plotHeight = height - margin.top - margin.bottom;
    return {
        width, height, margin, plotWidth, plotHeight,
        toX: temperature => margin.left + (temperature / MAX_TEMPERATURE) * plotWidth,
        toY: duty => margin.top + (1 - duty) * plotHeight,
        fromX: x => Math.max(0, Math.min(MAX_TEMPERATURE,
            ((x - margin.left) / plotWidth) * MAX_TEMPERATURE)),
        fromY: y => Math.max(0, Math.min(1, 1 - ((y - margin.top) / plotHeight)))
    };
}

// The fan is off below the first point. The floor can start earlier.
function curveStart(points) {
    const first = points.length ? points[0][0] : 0;
    if (activeCurve !== 'nozzle') return first;
    const limit = floorLimit();
    return limit ? Math.min(first, limit.temperature) : first;
}

// The curve is sampled every degree, so the line that is drawn is the line
// the driver follows.
function sampleCurve(points, evaluate) {
    const samples = [];
    for (let temperature = curveStart(points); temperature <= MAX_TEMPERATURE; temperature++) {
        samples.push([temperature, evaluate(points, temperature)]);
    }
    return samples;
}

function linePath(samples, geometry) {
    return samples.map((sample, index) => {
        const x = geometry.toX(sample[0]).toFixed(1);
        const y = geometry.toY(sample[1]).toFixed(1);
        return `${index === 0 ? 'M' : 'L'} ${x} ${y}`;
    }).join(' ');
}

// The part of the chart the driver holds at the floor, so the rule is
// visible instead of hidden inside the curve.
function floorLimitHit(points) {
    const limit = floorLimit();
    if (!limit || activeCurve !== 'nozzle') return null;
    const samples = sampleCurve(points, curveDuty);
    const below = samples.some(sample =>
        sample[0] >= limit.temperature && sample[1] < limit.duty - 1e-9);
    return below ? limit : null;
}

function renderChart() {
    const svg = $('chart');
    if (!svg || !state) return;
    // The chart is rebuilt, so the point that had the keyboard focus has to
    // get it back.
    const focused = document.activeElement;
    const focusIndex = focused && focused.classList && focused.classList.contains('chart-point')
        ? focused.dataset.index : null;

    chartSize = measureChart();
    svg.setAttribute('viewBox', `0 0 ${chartSize.width} ${chartSize.height}`);
    const geometry = chartGeometry();
    const points = shownPoints();
    const referencePoints = selectedProfile === 'stock' ? [] : (state.stock || {})[activeCurve] || [];
    const editable = isEditable();

    const grid = [0, 0.2, 0.4, 0.6, 0.8, 1].map(duty => {
        const y = geometry.toY(duty);
        return `<line class="chart-grid" x1="${geometry.margin.left}" y1="${y}" x2="${geometry.width - geometry.margin.right}" y2="${y}"/>` +
               `<text x="${geometry.margin.left - 8}" y="${y + 4}" text-anchor="end">${Math.round(duty * 100)}%</text>`;
    }).join('');
    const xLabels = [0, 100, 200, 300].map(temperature => {
        const x = geometry.toX(temperature);
        return `<line class="chart-grid" x1="${x}" y1="${geometry.margin.top}" x2="${x}" y2="${geometry.height - geometry.margin.bottom}"/>` +
               `<text x="${x}" y="${geometry.height - 12}" text-anchor="middle">${temperature}°C</text>`;
    }).join('');

    const samples = sampleCurve(points, curveDuty);
    const dutyPath = linePath(samples, geometry);
    const floor = floorLimitHit(points);

    let floorMark = '';
    if (floor) {
        const y = geometry.toY(floor.duty);
        const x = geometry.toX(floor.temperature);
        const label = `driver floor ${Math.round(floor.duty * 100)}% from ${floor.temperature}°C`;
        floorMark = `<line class="chart-floor-line" x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(geometry.width - geometry.margin.right).toFixed(1)}" y2="${y.toFixed(1)}"/>` +
                    `<rect class="chart-floor-label-bg" x="${(x + 4).toFixed(1)}" y="${(y - 18).toFixed(1)}" width="${(label.length * 5.6 + 8).toFixed(1)}" height="14" rx="3"></rect>` +
                    `<text class="chart-floor-label" x="${(x + 8).toFixed(1)}" y="${(y - 7).toFixed(1)}">${label}</text>`;
    }

    const referenceSamples = referencePoints.length ? sampleCurve(referencePoints, step) : [];
    const marks = points.map(([temperature, duty], index) => {
        const x = geometry.toX(temperature);
        const y = geometry.toY(duty);
        if (!editable) return `<circle class="chart-dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3"></circle>`;
        const active = index === selectedNode;
        return `<circle class="chart-point${active ? ' selected' : ''}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${active ? 9 : 7}" data-index="${index}" tabindex="0" role="button" aria-label="Point ${index + 1}: ${temperature} degrees, ${Math.round(duty * 100)} percent"></circle>`;
    }).join('');

    svg.innerHTML = `${grid}${xLabels}` +
        `<line class="chart-axis" x1="${geometry.margin.left}" y1="${geometry.height - geometry.margin.bottom}" x2="${geometry.width - geometry.margin.right}" y2="${geometry.height - geometry.margin.bottom}"/>` +
        `<line class="chart-axis" x1="${geometry.margin.left}" y1="${geometry.margin.top}" x2="${geometry.margin.left}" y2="${geometry.height - geometry.margin.bottom}"/>` +
        (referenceSamples.length ? `<path class="chart-reference" d="${linePath(referenceSamples, geometry)}"></path>` : '') +
        floorMark +
        (dutyPath ? `<path class="chart-line" d="${dutyPath}"></path>` : '') +
        (points.length ? marks :
            `<text x="${geometry.width / 2}" y="${geometry.height / 2}" text-anchor="middle">This profile has no curve</text>`);

    if (focusIndex !== null) {
        const next = svg.querySelector(`.chart-point[data-index="${focusIndex}"]`);
        if (next) next.focus();
    }

    $('legend-selected').textContent = profileLabel(selectedProfile);
    $('legend-stock').hidden = !referencePoints.length;
    $('legend-floor').hidden = !floor;
    $('hint').textContent = editable
        ? 'Click empty space to add a point, drag a point to move it, arrow keys to nudge it.'
        : 'Presets are read-only. Copy it to Custom to edit the points.';
}

// ---------------------------------------------------------------- compare

function compareTemperatures() {
    return activeCurve === 'nozzle'
        ? [50, 70, 100, 140, 180, 220, 260]
        : [45, 120, 160, 200, 260];
}

function heavyLoadText() {
    const heavy = state.heavyLoad || {};
    const temperature = Number(heavy.temperature) || 260;
    const heaterCount = Number(heavy.heater_count) || 0;
    const hotCount = Number(heavy.hot_count) || 1;
    const duty = Math.round((Number(heavy.duty) || 1) * 100);
    const heaters = heaterCount > 0
        ? `at least ${heaterCount} toolhead${heaterCount === 1 ? '' : 's'} heat up and `
        : '';
    return `Heavy load: the power fan reaches ${duty}% when ${heaters}${hotCount} toolhead${hotCount === 1 ? '' : 's'} target more than ${temperature}°C.`;
}

function renderCompare() {
    if (!state) return;
    const stockPoints = (state.stock || {})[activeCurve] || [];
    const points = shownPoints();
    const limit = floorLimit();
    let raised = false;
    $('compare-body').innerHTML = compareTemperatures().map(temperature => {
        const stock = step(stockPoints, temperature);
        const own = curveDuty(points, temperature);
        const duty = effectiveDuty(points, temperature);
        const held = duty > own + 1e-9;
        if (held) raised = true;
        return `<tr${held ? ' class="floored"' : ''}><td>${temperature}</td><td>${Math.round(stock * 100)}%</td><td>${Math.round(duty * 100)}%${held ? ' ↑' : ''}</td></tr>`;
    }).join('');
    $('compare-selected').textContent = profileLabel(selectedProfile);
    const notes = [];
    if (raised && limit) {
        notes.push(`↑ The driver holds a nozzle fan at ${Math.round(limit.duty * 100)}% from ${limit.temperature}°C on, so a curve cannot switch the fan off while the hotend is hot.`);
    }
    if (activeCurve === 'power') notes.push(heavyLoadText());
    $('compare-note').textContent = notes.join(' ');
}

// ---------------------------------------------------------------- point editor

function selectNode(index) {
    selectedNode = index;
    renderChart();
    renderPointEditor();
}

function renderPointEditor(force) {
    const editor = $('point-editor');
    const empty = $('point-empty');
    const points = draft[activeCurve] || [];
    if (!isEditable() || selectedNode < 0 || !points[selectedNode]) {
        editor.hidden = true;
        empty.hidden = false;
        $('point-title').textContent = 'Selected point';
        empty.textContent = isEditable()
            ? 'Click a point on the chart to edit it, click empty space to add one.'
            : 'The chart shows the duty the fan runs.';
        $('point-delete').disabled = true;
        return;
    }
    const [temperature, duty] = points[selectedNode];
    editor.hidden = false;
    empty.hidden = true;
    $('point-title').textContent = `Point ${selectedNode + 1} of ${points.length}`;
    // A field that is being typed into keeps its text, otherwise the clamp
    // would rewrite the number while the user is still writing it.
    if (force || document.activeElement !== $('point-temperature')) {
        $('point-temperature').value = temperature;
    }
    if (force || document.activeElement !== $('point-duty')) {
        $('point-duty').value = (duty * 100).toFixed(1);
    }
    $('point-delete').disabled = points.length <= 2;
}

// The neighbours bound the temperature, the driver keeps the order strict.
function nodeBounds(index) {
    const points = draft[activeCurve] || [];
    const previous = index > 0 ? points[index - 1][0] : -1;
    const next = index < points.length - 1 ? points[index + 1][0] : MAX_TEMPERATURE + 1;
    return { min: previous + 1, max: next - 1 };
}

function updateNode(index, temperature, duty) {
    const points = draft[activeCurve] || [];
    if (!points[index]) return;
    const bounds = nodeBounds(index);
    const clampedTemperature = Math.max(bounds.min, Math.min(bounds.max, Math.round(temperature)));
    const clampedDuty = Math.max(0, Math.min(maxDuty(), Math.round(duty * 1000) / 1000));
    if (points[index][0] === clampedTemperature && points[index][1] === clampedDuty) return;
    points[index] = [clampedTemperature, clampedDuty];
    dirty = true;
    renderChart();
    renderCompare();
    renderPointEditor();
}

function deleteNode() {
    const points = draft[activeCurve] || [];
    if (!isEditable() || selectedNode < 0 || points.length <= 2) return;
    points.splice(selectedNode, 1);
    selectedNode = Math.min(selectedNode, points.length - 1);
    dirty = true;
    renderAll();
    setStatus('Point deleted. Save Custom to keep it.');
}

// Adds a point at a free temperature. Returns the new index or -1.
function addPoint(temperature, duty) {
    const points = draft[activeCurve] || [];
    if (!isEditable()) return -1;
    if (points.length >= maxPoints()) {
        setStatus(`A curve holds at most ${maxPoints()} points.`, 'error');
        return -1;
    }
    let index = points.findIndex(point => point[0] > temperature);
    if (index === -1) index = points.length;
    const previous = index > 0 ? points[index - 1][0] : -1;
    const next = index < points.length ? points[index][0] : MAX_TEMPERATURE + 1;
    // The clicked temperature can land on a neighbour, which is one degree
    // away from a free spot. Move it there instead of refusing.
    let spot = temperature;
    if (spot <= previous) spot = previous + 1;
    if (spot >= next) spot = next - 1;
    if (spot <= previous || spot >= next) {
        setStatus('There is no room for another point between these two.', 'error');
        return -1;
    }
    points.splice(index, 0, [spot, duty]);
    selectedNode = index;
    dirty = true;
    renderAll();
    setStatus('Point added. Save Custom to keep it.');
    return index;
}

function addPointInBiggestGap() {
    const points = draft[activeCurve] || [];
    if (!isEditable()) return;
    if (points.length < 2) {
        addPoint(0, 0);
        return;
    }
    let gapIndex = 0;
    let gap = 0;
    for (let index = 0; index < points.length - 1; index++) {
        const currentGap = points[index + 1][0] - points[index][0];
        if (currentGap > gap) { gap = currentGap; gapIndex = index; }
    }
    if (gap < 2) {
        setStatus('There is no room for another point.', 'error');
        return;
    }
    const temperature = Math.round((points[gapIndex][0] + points[gapIndex + 1][0]) / 2);
    addPoint(temperature, Math.round((points[gapIndex][1] + points[gapIndex + 1][1]) * 500) / 1000);
}

// ---------------------------------------------------------------- pointer

function chartCoordinates(event) {
    const svg = $('chart');
    const rect = svg.getBoundingClientRect();
    const scaleX = chartSize.width / rect.width;
    const scaleY = chartSize.height / rect.height;
    const x = (event.clientX - rect.left) * scaleX;
    const y = (event.clientY - rect.top) * scaleY;
    const geometry = chartGeometry();
    return { x, y, temperature: geometry.fromX(x), duty: geometry.fromY(y) };
}

// A point is only added when the pointer was released on the chart, so a
// press that is followed by a click on a button cannot add one.
function pointerOnChart(event) {
    const rect = $('chart').getBoundingClientRect();
    return event.clientX >= rect.left && event.clientX <= rect.right &&
           event.clientY >= rect.top && event.clientY <= rect.bottom;
}

function onPointerDown(event) {
    if (!isEditable()) return;
    const target = event.target.closest('.chart-point');
    if (target) {
        event.preventDefault();
        const index = Number(target.dataset.index);
        selectNode(index);
        startDrag(index);
        return;
    }
    pendingClick = { x: event.clientX, y: event.clientY };
}

function startDrag(index) {
    const point = (draft[activeCurve] || [])[index];
    drag = { index, before: point ? point.slice() : null };
}

function onPointerMove(event) {
    if (pendingClick && Math.abs(event.clientX - pendingClick.x) + Math.abs(event.clientY - pendingClick.y) > 4) {
        pendingClick = null;
    }
    if (!drag) return;
    // A pointer that was released outside the window sends no pointerup.
    // The button state says that the drag is over.
    if (event.buttons === 0) {
        drag = null;
        return;
    }
    const position = chartCoordinates(event);
    const points = draft[activeCurve] || [];
    if (!points[drag.index]) return;
    const bounds = nodeBounds(drag.index);
    const temperature = Math.max(bounds.min, Math.min(bounds.max, Math.round(position.temperature)));
    const duty = Math.max(0, Math.min(maxDuty(), Math.round(position.duty * 1000) / 1000));
    points[drag.index] = [temperature, duty];
    dirty = true;
    renderChart();
    renderPointEditor();
}

function onPointerUp(event) {
    if (drag) {
        const moved = drag;
        drag = null;
        renderCompare();
        const point = (draft[activeCurve] || [])[moved.index];
        if (point && moved.before && (point[0] !== moved.before[0] || point[1] !== moved.before[1])) {
            setStatus('Point moved. Save Custom to keep it.');
        }
        return;
    }
    if (!pendingClick) return;
    pendingClick = null;
    if (!isEditable() || !pointerOnChart(event)) return;
    const position = chartCoordinates(event);
    addPoint(Math.round(position.temperature), Math.round(position.duty * 1000) / 1000);
}

// A pointer that leaves the window never sends a pointerup, so the drag has
// to be released here as well.
function onPointerCancel() {
    drag = null;
    pendingClick = null;
}

function onKeyDown(event) {
    if (!isEditable()) return;
    const target = event.target.closest('.chart-point');
    if (!target) {
        if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            addPointInBiggestGap();
        }
        return;
    }
    const index = Number(target.dataset.index);
    const points = draft[activeCurve] || [];
    const point = points[index];
    if (!point) return;
    const step = event.shiftKey ? 5 : 1;
    if (event.key === 'ArrowLeft') {
        event.preventDefault();
        updateNode(index, point[0] - step, point[1]);
    } else if (event.key === 'ArrowRight') {
        event.preventDefault();
        updateNode(index, point[0] + step, point[1]);
    } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        updateNode(index, point[0], point[1] + step / 100);
    } else if (event.key === 'ArrowDown') {
        event.preventDefault();
        updateNode(index, point[0], point[1] - step / 100);
    } else if (event.key === 'Delete' || event.key === 'Backspace') {
        event.preventDefault();
        selectNode(index);
        deleteNode();
    }
}

// ---------------------------------------------------------------- dialogs

let confirmAction = null;

function showConfirm(title, message, onConfirm) {
    $('confirm-title').textContent = title;
    $('confirm-body').textContent = message;
    confirmAction = onConfirm;
    $('confirm-backdrop').hidden = false;
}

function closeConfirm() {
    $('confirm-backdrop').hidden = true;
    confirmAction = null;
}

function showAction(title) {
    $('action-title').textContent = title;
    $('action-log').textContent = '';
    $('action-backdrop').hidden = false;
}

function appendLog(text) {
    $('action-log').textContent += text;
}

// ---------------------------------------------------------------- server

function getJWT() {
    const key = `user-token-${window.location.host.replace(/[^a-zA-Z0-9]/g, '_')}`;
    return localStorage.getItem(key);
}

async function apiFetch(url, options = {}) {
    const jwt = getJWT();
    options.headers = { ...(jwt ? { Authorization: `Bearer ${jwt}` } : {}), ...options.headers };
    const response = await fetch(url, options);
    if (!response.ok) {
        const detail = await response.text().catch(() => '');
        throw new Error(`HTTP ${response.status}${detail ? `: ${detail.slice(0, 200)}` : ''}`);
    }
    return response;
}

async function post(body, title, message) {
    showAction(title);
    try {
        const response = await apiFetch('api/fan-curves', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const contentType = response.headers.get('content-type') || '';
        let result = null;
        if (contentType.includes('application/json')) {
            result = await response.json();
            if (result && result.success === false) throw new Error(result.error || 'The operation failed');
            appendLog(`${result?.message || 'Done'}\n`);
        } else {
            appendLog(await response.text());
        }
        $('action-close').textContent = 'Close';
        return result;
    } catch (error) {
        appendLog(`\nERROR: ${error.message}`);
        $('action-close').textContent = 'Close';
        throw error;
    }
}

function notifyParent(type) {
    if (window.parent && window.parent !== window) {
        window.parent.postMessage({ source: 'fan-curves-editor', type: type || 'applied' },
            window.location.origin);
    }
}

// ---------------------------------------------------------------- actions

function renderRules() {
    const hysteresis = state.hysteresis;
    const limit = floorLimit();
    const floorText = limit
        ? `The driver holds a nozzle fan at ${Math.round(limit.duty * 100)}% from ${limit.temperature}°C on, so no curve can leave the fan off while the hotend is hot.`
        : '';
    const rules = `The duty is the line between the points. Non-Stock profiles use ${hysteresis}°C hysteresis, so a falling temperature waits before the duty follows. Ordinary duty goes up to ${Math.round(maxDuty() * 100)}%. ${floorText} ${heavyLoadText()}`;
    $('rules').textContent = selectedProfile === 'stock'
        ? 'Stock uses the original target-temperature and stepped-table semantics. It is read-only here.'
        : selectedProfile === 'custom'
        ? `Custom is a curve of your own, so how much it cools the hotend is on your risk. ${rules}`
        : `${profileLabel(selectedProfile)} is a preset. The first power node sets both the power-fan target trigger and its duty. ${rules}`;
}

function renderAll() {
    if (!state) return;
    const profileSelect = $('profile');
    profileSelect.value = selectedProfile;
    $('active').textContent = `Active: ${profileLabel(state.current)}`;
    $('power-tab').className = `btn ${activeCurve === 'power' ? 'btn-primary' : 'btn-secondary'}`;
    $('nozzle-tab').className = `btn ${activeCurve === 'nozzle' ? 'btn-primary' : 'btn-secondary'}`;
    $('copy').disabled = selectedProfile === 'stock' || selectedProfile === 'custom';
    $('add-point').disabled = !isEditable();
    $('discard').disabled = !dirty;
    $('save').disabled = !isEditable();
    $('apply').disabled = false;
    renderRules();
    renderChart();
    renderCompare();
    renderPointEditor();
}

function copyPresetToCustom() {
    if (selectedProfile === 'custom' || selectedProfile === 'stock') return;
    const source = state.presets[selectedProfile] || { power: [], nozzle: [] };
    draft = { power: source.power.map(point => point.slice()), nozzle: source.nozzle.map(point => point.slice()) };
    selectedProfile = 'custom';
    selectedNode = -1;
    dirty = true;
    renderAll();
    setStatus('Preset copied to Custom. Save it before applying.');
}

function resetDraft() {
    draft = { power: savedDraft.power.map(point => point.slice()), nozzle: savedDraft.nozzle.map(point => point.slice()) };
    selectedNode = -1;
    dirty = false;
    renderAll();
    setStatus('Draft restored from the saved Custom profile.');
}

function validateDraft() {
    const errors = [];
    ['power', 'nozzle'].forEach(name => {
        const points = draft[name] || [];
        if (points.length < 2) errors.push(`${name} needs at least two points`);
        if (points.length > maxPoints()) errors.push(`${name} has too many points`);
        points.forEach(([temperature, duty], index) => {
            if (!Number.isInteger(temperature) || temperature < 0 || temperature > MAX_TEMPERATURE) {
                errors.push(`${name} point ${index + 1} has an invalid temperature`);
            }
            if (!Number.isFinite(duty) || duty < 0 || duty > maxDuty()) {
                errors.push(`${name} point ${index + 1} exceeds the ordinary duty limit`);
            }
            if (index && temperature <= points[index - 1][0]) {
                errors.push(`${name} temperatures must increase strictly`);
            }
        });
    });
    return errors;
}

function saveCustom() {
    const errors = validateDraft();
    if (errors.length) {
        setStatus(errors.join('; '), 'error');
        return;
    }
    showConfirm('Save Custom fan curves', 'Save the current power and nozzle curves as Custom?', async () => {
        closeConfirm();
        try {
            await post({ action: 'save', curves: { power: draft.power, nozzle: draft.nozzle } },
                'Save Custom fan curves', 'Saving');
            savedDraft = { power: draft.power.map(point => point.slice()), nozzle: draft.nozzle.map(point => point.slice()) };
            dirty = false;
            setStatus('Custom saved.', 'success');
        } catch (error) {
            setStatus(error.message, 'error');
        }
    });
}

function applyProfile() {
    const errors = validateDraft();
    if (errors.length) {
        setStatus(errors.join('; '), 'error');
        return;
    }
    const body = { action: 'apply', profile: selectedProfile };
    if (selectedProfile === 'custom') body.curves = { power: draft.power, nozzle: draft.nozzle };
    const label = profileLabel(selectedProfile);
    showConfirm(`Apply ${label}`,
        'Applying a fan profile restarts Klipper and may interrupt a print. Continue?', async () => {
        closeConfirm();
        try {
            await post(body, `Apply ${label}`, 'Applying');
            // Applying a preset does not write the Custom curve, so a
            // Custom that is being worked on stays worked on.
            if (selectedProfile === 'custom') dirty = false;
            setStatus(`${label} applied.`, 'success');
            notifyParent();
        } catch (error) {
            setStatus(error.message, 'error');
        }
    });
}

async function reloadState(keepDraft) {
    const payload = await (await apiFetch('api/fan-curves')).json();
    const keep = keepDraft && dirty;
    const currentDraft = {
        power: draft.power.map(point => point.slice()),
        nozzle: draft.nozzle.map(point => point.slice())
    };
    state = normalize(payload);
    if (keep) {
        draft = currentDraft;
        dirty = true;
    } else {
        selectedProfile = state.current;
    }
    const select = $('profile');
    select.innerHTML = state.profiles
        .map(key => `<option value="${escapeHtml(key)}">${escapeHtml(profileLabel(key))}</option>`)
        .join('');
    renderAll();
}

async function load() {
    try {
        await reloadState(false);
    } catch (error) {
        setStatus(`The fan curve API is unavailable: ${error.message}`, 'error');
    }
}

// ---------------------------------------------------------------- wiring

$('profile').addEventListener('change', event => {
    selectedProfile = event.target.value;
    selectedNode = -1;
    setStatus('');
    renderAll();
});
$('power-tab').addEventListener('click', () => { activeCurve = 'power'; selectedNode = -1; renderAll(); });
$('nozzle-tab').addEventListener('click', () => { activeCurve = 'nozzle'; selectedNode = -1; renderAll(); });
$('copy').addEventListener('click', copyPresetToCustom);
$('add-point').addEventListener('click', addPointInBiggestGap);
$('discard').addEventListener('click', resetDraft);
$('save').addEventListener('click', saveCustom);
$('apply').addEventListener('click', applyProfile);
$('point-delete').addEventListener('click', deleteNode);
$('point-temperature').addEventListener('input', event => {
    if (!isEditable() || selectedNode < 0) return;
    const value = Number(event.target.value);
    if (!Number.isFinite(value)) return;
    const points = draft[activeCurve] || [];
    updateNode(selectedNode, value, points[selectedNode][1]);
});
$('point-duty').addEventListener('input', event => {
    if (!isEditable() || selectedNode < 0) return;
    const value = Number(event.target.value);
    if (!Number.isFinite(value)) return;
    const points = draft[activeCurve] || [];
    updateNode(selectedNode, points[selectedNode][0], value / 100);
});
$('point-temperature').addEventListener('change', () => {
    renderPointEditor(true);
});
$('point-duty').addEventListener('change', () => {
    renderPointEditor(true);
});
$('confirm-ok').addEventListener('click', () => {
    const action = confirmAction;
    closeConfirm();
    if (action) action();
});
$('confirm-cancel').addEventListener('click', closeConfirm);
$('action-close').addEventListener('click', () => { $('action-backdrop').hidden = true; });

const chart = $('chart');
chart.addEventListener('pointerdown', onPointerDown);
chart.addEventListener('keydown', onKeyDown);
window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', onPointerCancel);
window.addEventListener('blur', onPointerCancel);

// A press on the chart is only a click to add a point when the pointer is
// released on the chart as well. Any other press cancels it.
document.addEventListener('pointerdown', () => { pendingClick = null; }, true);

// The chart fills the panel, so it is drawn again when the panel changes.
if (window.ResizeObserver) {
    new ResizeObserver(() => renderChart()).observe($('chart-wrap'));
}
window.addEventListener('resize', renderChart);

// The main page asks for a fresh state when the profile was changed there.
window.addEventListener('message', event => {
    if (event.origin !== window.location.origin) return;
    const data = event.data || {};
    if (data.source !== 'fan-curves-main') return;
    if (data.type === 'close') {
        notifyParent('closed');
        return;
    }
    if (data.type !== 'refresh') return;
    $('action-backdrop').hidden = true;
    reloadState(true).catch(error => {
        setStatus(error.message, 'error');
    });
});

// The editor lives in a frame, so Escape has to be handed to the page that
// opened it.
document.addEventListener('keydown', event => {
    if (event.key === 'Escape') notifyParent('close');
});

load();
</script>
</body>
</html>
