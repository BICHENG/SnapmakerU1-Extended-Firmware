# fan-curves: lazy
# Temperature-controlled fans stay off below 220C, except the cavity safety guard.
# Normal power fan duty is capped at 60%; the two-nozzle, over-200°C heavy-load override stays at 100%.

[heater_fan power_fan]
temp_speed_table:
  260, 9999, 1, 0, 0.60
  250, 9999, 1, 0, 0.48
  240, 9999, 1, 0, 0.32
  230, 9999, 1, 0, 0.18
  220, 9999, 1, 0, 0.08
temp_hysteresis: 3.0
target_temp_threshold: 220.0
target_temp_speed: 0.08
heavy_load_target_temp_threshold: 200.0
heavy_load_target_temp_heater_count: 2
heavy_load_target_temp_speed: 1.00

[heater_fan e0_nozzle_fan]
temp_speed_table:
  260, 9999, 1, 0, 0.60
  250, 9999, 1, 0, 0.44
  240, 9999, 1, 0, 0.28
  230, 9999, 1, 0, 0.16
  220, 9999, 1, 0, 0.08
temp_hysteresis: 3.0
external_temp_sensor: cavity
external_temp_guard_range: -15.0, 55.0
external_temp_guard_fan_speed: 0.60
external_temp_hysteresis: 3.0

[heater_fan e1_nozzle_fan]
temp_speed_table:
  260, 9999, 1, 0, 0.60
