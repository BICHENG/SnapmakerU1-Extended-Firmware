settings:
  tweaks:
    items:
      fan_curves:
        label: Fan Curves
        description: Select cooling curves for the power fan and all four nozzle fans. Stock restores the original Snapmaker curves. Custom is the profile the firmware ships; it starts out as the original Snapmaker curves. Every profile is a file in the fan-curves-presets directory, so the fan curve editor can draw it, rename it and remove it.
        help_url: http://snapmakeru1-extended-firmware.pages.dev/tweaks#fan-curves
        get_cmd:
          - bash
          - -c
          - |
            python3 /usr/local/bin/fan_curves.py profile 2>/dev/null || echo stock
        options:
          stock:
            label: Stock
            confirm: Restore the original Snapmaker fan curves?
            cmd:
              - bash
              - -xc
              - |
                python3 /usr/local/bin/fan_curves.py apply stock
        default: stock
