# The phone microphone as a sound card.
#
# A consumer opens "auxmic" and reads the capture side of the loopback card,
# which carries whatever the phone is sending.  The card fixes its format
# when the first side opens it, and the pacer opens the playback side in
# 48 kHz stereo s16le, so a consumer asks for the same.
pcm.auxmic {
    type plug
    slave.pcm "hw:Loopback,1"
    hint {
        show on
        description "auxmic phone microphone"
    }
}
