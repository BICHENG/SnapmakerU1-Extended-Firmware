name: Personal UI firmware
on:
  push:
    branches: [personal-ui]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: personal-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui:
    uses: ./.github/workflows/helix-gpu.yaml
  firmware:
    needs: ui
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: helix-u1-gpu
          path: tmp/helix-gpu
      - name: Verify screen binary
        run: cd tmp/helix-gpu && sha256sum -c SHA256SUMS
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .github/dev
          load: true
          tags: snapmaker-u1-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Read source versions
        run: cat vars.mk >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: firmware/
          key: firmwares-${{ runner.os }}-${{ runner.arch }}-${{ env.FIRMWARE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: tmp/kernel/
          key: kernels-${{ runner.os }}-${{ runner.arch }}-${{ env.KERNEL_SHA }}
      - uses: actions/cache@v4
        with:
          path: |
            tmp/ccache/
            tmp/cache/
          key: personal-ui-build-${{ github.sha }}
          restore-keys: personal-ui-build-
      - name: Build personal firmware
        run: |
          ./dev.sh make firmware
          ./dev.sh make build PROFILE=extended-BICHENG OUTPUT_FILE=U1_personal-ui_${GITHUB_SHA}_upgrade.bin
          sha256sum U1_personal-ui_*_upgrade.bin > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: personal-ui-firmware
          path: |
            U1_personal-ui_*_upgrade.bin
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14
