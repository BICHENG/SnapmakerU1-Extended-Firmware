name: U1 GPU screen
on:
  push:
    branches: [personal-ui]
    paths:
      - .github/workflows/helix-gpu.yaml
      - .github/scripts/prepare-helix-gpu.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned HelixScreen source
        run: |
          git clone --depth 1 --branch v1.0.7 https://github.com/prestonbrown/helixscreen.git helix
          test "$(git -C helix rev-parse HEAD)" = faed4e35010e970ba5612e9b2e109c52a11965a6
          git -C helix submodule update --init --recursive --depth 1
          python3 .github/scripts/prepare-helix-gpu.py helix
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: helix/docker
          file: helix/docker/Dockerfile.snapmaker-u1
          load: true
          tags: helix-u1-gpu:local
          cache-from: type=gha,scope=helix-u1-gpu
          cache-to: type=gha,scope=helix-u1-gpu,mode=max
      - uses: actions/cache@v4
        with:
          path: helix/build
          key: helix-u1-gpu-v1-${{ github.sha }}
          restore-keys: helix-u1-gpu-v1-
      - name: Compile U1 framebuffer UI with GPU G-code rendering
        run: |
          docker run --rm -v "$PWD/helix:/src" -w /src helix-u1-gpu:local \
            make PLATFORM_TARGET=snapmaker-u1 DISPLAY_BACKEND=fbdev ENABLE_GLES_3D=yes ENABLE_OPENGLES=no SKIP_OPTIONAL_DEPS=1 -j4
          sha256sum helix/build/snapmaker-u1/bin/helix-screen > helix/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: helix-u1-gpu
          path: |
            helix/build/snapmaker-u1/bin/helix-screen
            helix/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
