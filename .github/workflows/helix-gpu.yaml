name: Helix U1 GPU
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: binary
        with:
          path: ui-artifact
          key: helix-u1-gpu-binary-${{ hashFiles('.github/workflows/helix-gpu.yaml', '.github/scripts/prepare-helix-gpu.py', 'overlays/mods/BICHENG/71-ui-gpu/apps/helix-gpu-shared.patch', 'overlays/mods/BICHENG/71-ui-gpu/apps/ui-gpu/gpu_output.*', 'overlays/firmware-extended/69-app-helixscreen/root/usr/local/share/extended-pkg/helixscreen') }}
      - name: Fetch and prepare pinned Helix source
        if: steps.binary.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.0.7 https://github.com/prestonbrown/helixscreen.git helix
          test "$(git -C helix rev-parse HEAD)" = faed4e35010e970ba5612e9b2e109c52a11965a6
          git -C helix submodule update --init --recursive --depth 1
          python3 .github/scripts/prepare-helix-gpu.py prepare helix
      - uses: docker/setup-buildx-action@v3
        if: steps.binary.outputs.cache-hit != 'true'
      - uses: docker/build-push-action@v6
        if: steps.binary.outputs.cache-hit != 'true'
        with:
          context: helix/docker
          file: helix/docker/Dockerfile.snapmaker-u1
          load: true
          tags: helix-u1-gpu:local
          cache-from: type=gha,scope=helix-u1-gpu
          cache-to: type=gha,scope=helix-u1-gpu,mode=max
      - uses: actions/cache@v4
        if: steps.binary.outputs.cache-hit != 'true'
        with:
          path: helix/.ccache
          key: helix-u1-gpu-ccache-${{ runner.arch }}-${{ github.sha }}
          restore-keys: helix-u1-gpu-ccache-${{ runner.arch }}-
      - name: Compile U1 GPU G-code with the software fbdev UI
        if: steps.binary.outputs.cache-hit != 'true'
        run: |
          docker run --rm -e CCACHE_DIR=/src/.ccache -v "$PWD/helix:/src" -w /src helix-u1-gpu:local \
            make PLATFORM_TARGET=snapmaker-u1 DISPLAY_BACKEND=fbdev ENABLE_GLES_3D=yes ENABLE_OPENGLES=no SKIP_OPTIONAL_DEPS=1 -j4
          python3 .github/scripts/prepare-helix-gpu.py package helix ui-artifact
      - name: Verify artifact source and checksums
        run: python3 .github/scripts/prepare-helix-gpu.py verify ui-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: helix-u1-gpu
          path: ui-artifact/
          if-no-files-found: error
          retention-days: 14
